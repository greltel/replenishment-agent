<!doctype html>
<html>
<head><meta charset="utf-8"><title>theme bridge</title></head>
<body>
<script>
/* Zero-height Streamlit component.
   Streamlit sends every component a "render" message carrying the active
   theme (base: "light" | "dark") and re-sends it when the user switches
   theme in the ⋮ menu. When the browser's theme differs from the one the
   script rendered with (args.current), we report it as the component value;
   a changed value makes Streamlit rerun the script, which then draws with
   the matching palette. Nothing is sent when they already agree, so the
   first page load costs no extra rerun. */
(function () {
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  var last = null;
  window.addEventListener("message", function (ev) {
    var m = ev.data || {};
    if (m.type !== "streamlit:render") return;
    var base = (m.theme && m.theme.base) || "light";
    var current = (m.args && m.args.current) || null;
    if (base !== current && base !== last) {
      last = base;
      send("streamlit:setComponentValue", { value: base, dataType: "json" });
    }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
